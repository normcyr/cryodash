version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: cryodash-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cryo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cryo}
      - POSTGRES_DB=${POSTGRES_DB:-cryodash}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cryodash-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cryodash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryodash-app
    ports:
      - "8000:8000"
    volumes:
      - cryodash_data:/app/data
      - cryodash_logs:/app/logs
    env_file:
      - .env
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - DEBUG=${DEBUG:-False}
      # Allow DATABASE_URL override; default to sqlite for local/dev
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/cryodash.db}
      - DB_ECHO=${DB_ECHO:-False}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - TZ=America/Toronto
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - cryodash-network
    labels:
      - "com.example.description=CryoDash - Cryogenic Level Monitoring"
      - "com.example.version=0.1.0"
    depends_on:
      - postgres

volumes:
  cryodash_data:
    driver: local
  cryodash_logs:
    driver: local
  postgres_data:
    driver: local

networks:
  cryodash-network:
    driver: bridge
