version: "3.8"

services:
  cryodash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryodash-app
    ports:
      - "8000:8000"
    volumes:
      - cryodash_data:/app/data
      - cryodash_logs:/app/logs
    env_file:
      - .env
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/cryodash.db}
      - DB_ECHO=${DB_ECHO:-False}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - TZ=America/Toronto
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - cryodash-network
    labels:
      - "com.example.description=CryoDash - Cryogenic Level Monitoring"
      - "com.example.version=0.1.0"

volumes:
  cryodash_data:
    driver: local
  cryodash_logs:
    driver: local

networks:
  cryodash-network:
    driver: bridge
