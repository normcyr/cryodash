<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Measurements - CryoDash</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 30px;
      }

      header {
        margin-bottom: 30px;
        border-bottom: 3px solid #3498db;
        padding-bottom: 20px;
      }

      h1 {
        color: #2c3e50;
        margin-bottom: 10px;
        font-size: 2em;
      }

      .nav {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
      }

      .nav a {
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        transition: all 0.3s ease;
        font-weight: 500;
      }

      .nav a:hover {
        transform: translateY(-2px);
      }

      .nav a.dashboard {
        background: #2c3e50;
        color: white;
      }

      .nav a.measurements {
        background: #3498db;
        color: white;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
      }

      .stat-card.green {
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      }

      .stat-card.blue {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      }

      .stat-card.orange {
        background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      }

      .stat-value {
        font-size: 2em;
        font-weight: bold;
        margin-bottom: 5px;
      }

      .stat-label {
        font-size: 0.9em;
        opacity: 0.9;
      }

      .filters {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
      }

      label {
        font-weight: 600;
        margin-bottom: 8px;
        color: #2c3e50;
        font-size: 0.9em;
      }

      input,
      select {
        padding: 10px 12px;
        border: 2px solid #ddd;
        border-radius: 6px;
        font-size: 0.95em;
        transition: border-color 0.3s ease;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
      }

      .button-group {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      button {
        padding: 10px 20px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      button:hover {
        background: #2980b9;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
      }

      button.clear {
        background: #e74c3c;
      }

      button.clear:hover {
        background: #c0392b;
      }

      .table-wrapper {
        overflow-x: auto;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }

      thead {
        background: #2c3e50;
        color: white;
        position: sticky;
        top: 0;
      }

      th {
        padding: 15px;
        text-align: left;
        font-weight: 600;
        font-size: 0.95em;
      }

      td {
        padding: 12px 15px;
        border-bottom: 1px solid #eee;
      }

      tbody tr:hover {
        background: #f8f9fa;
        transition: background 0.2s ease;
      }

      .type-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.85em;
        font-weight: 600;
        white-space: nowrap;
      }

      .type-cryogen {
        background: #e8f4f8;
        color: #0c5460;
      }

      .type-temperature {
        background: #fff3cd;
        color: #856404;
      }

      .type-humidity {
        background: #d1ecf1;
        color: #0c5460;
      }

      .type-pressure {
        background: #f8d7da;
        color: #721c24;
      }

      .type-status {
        background: #d4edda;
        color: #155724;
      }

      .metadata {
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: monospace;
        font-size: 0.85em;
        color: #7f8c8d;
      }

      .timestamp {
        font-family: monospace;
        font-size: 0.9em;
        color: #7f8c8d;
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #7f8c8d;
      }

      .empty-state svg {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        opacity: 0.3;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #3498db;
      }

      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .pagination {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
      }

      .pagination button {
        padding: 8px 12px;
        min-width: 40px;
      }

      .pagination button.active {
        background: #2c3e50;
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        display: none;
      }

      .error.show {
        display: block;
      }

      @media (max-width: 768px) {
        .filters {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        table {
          font-size: 0.85em;
        }

        th,
        td {
          padding: 8px 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📊 Measurements</h1>
        <nav class="nav">
          <a href="/index.html" class="dashboard">← Dashboard</a>
          <a href="/measurements.html" class="measurements">Measurements (Current)</a>
        </nav>
      </header>

      <div class="stats">
        <div class="stat-card green">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total Measurements</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-value" id="stat-types">0</div>
          <div class="stat-label">Measurement Types</div>
        </div>
        <div class="stat-card orange">
          <div class="stat-value" id="stat-devices">0</div>
          <div class="stat-label">Devices</div>
        </div>
      </div>

      <div class="error" id="error-message"></div>

      <div class="filters">
        <div class="filter-group">
          <label for="filter-device">Device</label>
          <input
            type="text"
            id="filter-device"
            placeholder="e.g., neo600"
            autocomplete="off"
          />
        </div>
        <div class="filter-group">
          <label for="filter-location">Location</label>
          <input
            type="text"
            id="filter-location"
            placeholder="e.g., magnet_room"
            autocomplete="off"
          />
        </div>
        <div class="filter-group">
          <label for="filter-type">Measurement Type</label>
          <input
            type="text"
            id="filter-type"
            placeholder="e.g., temperature"
            autocomplete="off"
          />
        </div>
        <div class="filter-group">
          <label for="filter-hours">Hours</label>
          <select id="filter-hours">
            <option value="1">Last 1 hour</option>
            <option value="6">Last 6 hours</option>
            <option value="24" selected>Last 24 hours</option>
            <option value="48">Last 48 hours</option>
            <option value="168">Last 7 days</option>
            <option value="720">Last 30 days</option>
          </select>
        </div>
        <div class="button-group" style="grid-column: 1 / -1">
          <button onclick="applyFilters()">🔍 Filter</button>
          <button class="clear" onclick="clearFilters()">Clear</button>
        </div>
      </div>

      <div class="table-wrapper">
        <div class="loading" id="loading-state" style="display: none">
          <div class="spinner"></div>
          <p>Loading measurements...</p>
        </div>
        <table id="measurements-table" style="display: none">
          <thead>
            <tr>
              <th>ID</th>
              <th>Device</th>
              <th>Location</th>
              <th>Type</th>
              <th>Value</th>
              <th>Timestamp</th>
              <th>Metadata</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display: none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <h3>No measurements found</h3>
          <p>Try adjusting your filters or check back later</p>
        </div>
      </div>
    </div>

    <script>
      // Type badge colors
      const typeBadgeColors = {
        cryogen_level: "type-cryogen",
        temperature: "type-temperature",
        humidity: "type-humidity",
        pressure: "type-pressure",
        status: "type-status",
      };

      // Format timestamp
      function formatTimestamp(isoString) {
        const date = new Date(isoString);
        return date.toLocaleString("en-US", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        });
      }

      // Load measurements
      async function loadMeasurements() {
        const device = document.getElementById("filter-device").value;
        const location = document.getElementById("filter-location").value;
        const type = document.getElementById("filter-type").value;
        const hours = document.getElementById("filter-hours").value;

        // Show loading state
        document.getElementById("loading-state").style.display = "block";
        document.getElementById("measurements-table").style.display = "none";
        document.getElementById("empty-state").style.display = "none";
        document.getElementById("error-message").classList.remove("show");

        try {
          // Build query string
          const params = new URLSearchParams();
          if (device) params.append("device", device);
          if (location) params.append("location", location);
          if (type) params.append("measurement_type", type);
          params.append("hours", hours);
          params.append("limit", 500);

          const response = await fetch(`/api/measurements?${params}`, {
            timeout: 10000,
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const measurements = await response.json();

          // Update stats
          updateStats(measurements);

          // Populate table
          if (measurements.length === 0) {
            document.getElementById("empty-state").style.display = "block";
          } else {
            populateTable(measurements);
            document.getElementById("measurements-table").style.display = "table";
          }
        } catch (error) {
          console.error("Error loading measurements:", error);
          const errorDiv = document.getElementById("error-message");
          errorDiv.textContent = `Error: ${error.message}`;
          errorDiv.classList.add("show");
        } finally {
          document.getElementById("loading-state").style.display = "none";
        }
      }

      // Update statistics
      function updateStats(measurements) {
        // Total measurements
        document.getElementById("stat-total").textContent = measurements.length;

        // Unique types
        const types = new Set(
          measurements.map((m) => m.measurement_type)
        );
        document.getElementById("stat-types").textContent = types.size;

        // Unique devices
        const devices = new Set(
          measurements.filter((m) => m.device).map((m) => m.device)
        );
        document.getElementById("stat-devices").textContent = devices.size;
      }

      // Populate table with measurements
      function populateTable(measurements) {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";

        measurements.forEach((m) => {
          const row = document.createElement("tr");
          const badgeClass =
            typeBadgeColors[m.measurement_type] || "type-status";
          const metadata = m.data
            ? JSON.stringify(m.data).substring(0, 50)
            : "—";

          row.innerHTML = `
            <td>${m.id}</td>
            <td>${m.device || "—"}</td>
            <td>${m.location || "—"}</td>
            <td><span class="type-badge ${badgeClass}">${m.measurement_type}</span></td>
            <td>${m.value !== null ? `${m.value} ${m.unit || ""}` : "—"}</td>
            <td class="timestamp">${formatTimestamp(m.timestamp)}</td>
            <td class="metadata" title="${metadata}">${metadata}</td>
          `;
          tbody.appendChild(row);
        });
      }

      // Apply filters
      function applyFilters() {
        loadMeasurements();
      }

      // Clear filters
      function clearFilters() {
        document.getElementById("filter-device").value = "";
        document.getElementById("filter-location").value = "";
        document.getElementById("filter-type").value = "";
        document.getElementById("filter-hours").value = "24";
        loadMeasurements();
      }

      // Load on page load
      window.addEventListener("load", loadMeasurements);

      // Auto-refresh every 30 seconds
      setInterval(loadMeasurements, 30000);
    </script>
  </body>
</html>
